      <h2>Configuración de la página</h2>
      <p>Personaliza las preferencias de visualización para Lipi™.</p>
      
      <div style="margin-top: 30px;">
        <label for="theme-select" style="font-weight: bold; margin-right: 10px;">Seleccionar Tema:</label>

          <option value="dark">Oscuro (Default)</option>
          <option value="light">Blanco</option>
          <option value="auto">Automático (Sistema)</option>
        </select>
